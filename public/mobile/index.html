<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="ALLEN: entiende, practica y avanza a tu ritmo. Curso inicial disponible sin conexión después de descargarlo.">
  <link rel="manifest" href="./manifest.webmanifest">

    <button type="button" data-view="today">Hoy</button>

    <button type="button" data-view="allen">Allen</button>
