name: windows-distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/library/**"
      - "config/**"
      - "distribution/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/windows-distribution.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/library/**"
      - "config/**"
      - "distribution/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/windows-distribution.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build portable and installer
        shell: powershell
        run: .\distribution\build_windows.ps1

      - name: Upload portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allen-portable
          path: artifacts/*-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allen-installer
          path: artifacts/*-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
