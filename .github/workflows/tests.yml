name: tests
on:
  push:
    branches:
      - main
      - ui/offline-experience-refresh
      - feature/allen-offline-v2
      - feature/allen-study-planner
      - feature/allen-learning-continuity
      - feature/allen-product-polish
      - feature/allen-guided-learning-studio
      - feature/allen-learning-intelligence
      - feature/allen-reliability-core
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.mjs
