name: android-apk

# Builds the release APK from source and verifies the published one: never debuggable, only the
# local reminder permissions, signed with the ALLEN release key through the v3 rotation lineage.
on:
  push:
    branches: [main]
    paths: ["android/**", "public/mobile/**", "VERSION", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", "public/mobile/**", "VERSION", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build web assets (no downloads)
        run: python android/build_web_assets.py
      - name: Build release APK (Gradle distribution verified by distributionSha256Sum)
        working-directory: android
        run: JAVA_HOME="$JAVA_HOME_17_X64" sh ./gradlew assembleRelease --no-daemon
      - name: Built APK is not debuggable and only requests reminder permissions
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          badging="$("$aapt2" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk)"
          echo "$badging" | grep -E "^package:"
          if echo "$badging" | grep -q "application-debuggable"; then
            echo "::error::APK depurable"; exit 1
          fi
          # Only the local reminder permissions are allowed (never INTERNET).
          extra="$(echo "$badging" | grep -oE "uses-permission: name='[^']+'" | grep -vE "POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED" || true)"
          if [ -n "$extra" ]; then
            echo "::error::Permisos no permitidos: $extra"; exit 1
          fi
      - name: Published APK is signed, rotated, not debuggable and permission-free
        run: JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH" python android/sign_release.py verify
