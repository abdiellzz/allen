name: license-manager-windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/license_manager.py"
      - "requirements-build.txt"
      - "requirements.txt"
      - ".github/workflows/license-manager-windows.yml"
  push:
    branches: [main]
    paths:
      - "tools/license_manager.py"
      - "requirements-build.txt"
      - "requirements.txt"
      - ".github/workflows/license-manager-windows.yml"

permissions:
  contents: read

jobs:
  build-license-manager:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        shell: powershell
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Self-test generator
        shell: powershell
        run: python tools/license_manager.py --self-test

      - name: Build private manager executable
        shell: powershell
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ALLEN-License-Manager tools/license_manager.py

      - name: Upload license manager
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allen-license-manager
          path: dist/ALLEN-License-Manager.exe
          if-no-files-found: error
          retention-days: 30
